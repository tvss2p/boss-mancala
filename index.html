<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ボス戦マンカラ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0a0614">
<style>
/* 全面の canvas に描き、タイトル・スキル・結果だけガラスのカードを重ねる */
:root {
  --void: #0a0614;
  --ink: #f2eeff;
  --ink-dim: rgba(230, 222, 255, 0.7);
  --glass-top: rgba(255, 255, 255, 0.16);
  --glass-bot: rgba(255, 255, 255, 0.05);
  --line: rgba(255, 255, 255, 0.24);
  --accent: #ffe14d;
  --accent-ink: #2a1450;
  --f-jp: 'M PLUS Rounded 1c', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
  --f-num: 'Dela Gothic One', 'Hiragino Sans', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { background: var(--void); color: var(--ink); font-family: var(--f-jp); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.glass {
  background: linear-gradient(160deg, var(--glass-top), var(--glass-bot));
  -webkit-backdrop-filter: blur(18px) saturate(170%); backdrop-filter: blur(18px) saturate(170%);
  border: 1px solid var(--line);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 14px 36px rgba(0, 0, 0, 0.45);
}
.panel { position: fixed; inset: 0; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); z-index: 5; }
.panel.dim { background: rgba(6, 4, 16, 0.55); }
.card { width: min(360px, 100%); border-radius: 28px; padding: 26px 22px 22px; text-align: center; }
.logo { margin: 0; font-family: var(--f-num); font-size: 32px; font-weight: 400; letter-spacing: 0.04em; text-wrap: balance;
  background: linear-gradient(90deg, #ff9ec4, #ffe14d, #8fe6ff, #c69bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { margin: 6px 0 18px; color: var(--ink-dim); font-size: 13px; }
.rules { list-style: none; margin: 0 0 20px; padding: 0; text-align: left; display: grid; gap: 10px; font-size: 14px; line-height: 1.55; }
.rules li { display: flex; gap: 10px; }
.rules .n { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 900; font-size: 12px; display: grid; place-items: center; margin-top: 1px; }
.rules b { color: var(--accent); }
.btn { appearance: none; border: 0; width: 100%; padding: 15px; border-radius: 18px; font: 900 17px var(--f-jp); color: var(--accent-ink); background: linear-gradient(180deg, #fff27a, #ffc93d); box-shadow: 0 6px 0 #b8781e, 0 10px 24px rgba(0, 0, 0, 0.35); cursor: pointer; }
.btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #b8781e; }
.btn:disabled { filter: grayscale(1) brightness(0.7); }
.btn:focus-visible, .link:focus-visible { outline: 3px solid #8fe6ff; outline-offset: 3px; }
.link { appearance: none; background: none; border: 0; color: var(--ink-dim); font: 700 14px var(--f-jp); margin-top: 12px; padding: 8px; cursor: pointer; }
.big { margin: 0 0 6px; font-family: var(--f-num); font-size: 38px; font-weight: 400; }
#skill { position: fixed; left: 50%; bottom: calc(50% - 30px); transform: translateX(-50%); width: min(340px, calc(100% - 32px)); border-radius: 22px; padding: 16px 18px; z-index: 6; text-align: left; }
#skName { margin: 0; font-size: 13px; color: var(--ink-dim); }
#skSkill { margin: 2px 0 6px; font-family: var(--f-num); font-size: 22px; font-weight: 400; }
#skText { margin: 0 0 10px; font-size: 14px; line-height: 1.55; }
#skCharge { margin: 0 0 12px; font-size: 13px; font-weight: 800; color: var(--accent); }
.row { display: flex; gap: 10px; align-items: center; }
.row .btn { padding: 12px; font-size: 16px; }
.row .link { margin: 0; flex: none; }
#title { display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: calc(env(safe-area-inset-top, 0px) + 9vh) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 6vh) max(16px, env(safe-area-inset-left, 0px)); }
.tTop { text-align: center; }
#title .logo { font-size: clamp(40px, 12vw, 56px); line-height: 1.1; filter: drop-shadow(0 4px 0 #2a1050) drop-shadow(0 0 18px rgba(255, 200, 255, 0.55)); animation: glow 3s ease-in-out infinite; }
.tag { margin: 10px 0 0; font-size: 14px; font-weight: 800; color: #fff; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8); letter-spacing: 0.08em; }
.tBottom { width: min(320px, 100%); display: grid; gap: 4px; justify-items: center; }
.tBottom .btn { font-size: 20px; padding: 17px; animation: bob 2.4s ease-in-out infinite; }
.tBottom .link { color: #fff; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9); }
.big.small { font-size: 26px; margin-bottom: 14px; }
@keyframes glow { 50% { filter: drop-shadow(0 4px 0 #2a1050) drop-shadow(0 0 30px rgba(255, 220, 140, 0.8)); } }
@keyframes bob { 50% { transform: translateY(-3px); } }
@media (prefers-reduced-motion: reduce) { #title .logo, .tBottom .btn { animation: none; } }
#rotate { position: fixed; inset: 0; display: grid; place-items: center; background: var(--void); z-index: 9; font-size: 18px; font-weight: 800; }
</style>

<canvas id="cv"></canvas>

<div class="panel" id="title">
  <div class="tTop">
    <h1 class="logo">ボス戦マンカラ</h1>
    <p class="tag">ガラス玉で戦う、マンカラRPG</p>
  </div>
  <div class="tBottom">
    <button class="btn" id="startBtn" type="button">はじめる</button>
    <button class="link" id="howBtn" type="button">あそびかた</button>
  </div>
</div>

<div class="panel dim" id="how" hidden>
  <div class="card glass">
    <p class="big small">あそびかた</p>
    <ul class="rules">
      <li><span class="n">1</span><span><b>白い穴</b>をタップすると流れる道が光る。もう一度タップで玉を1個ずつ流す。</span></li>
      <li><span class="n">2</span><span><b>自分のゴール</b>に入った玉の色のキャラが攻撃。最後の1個がゴールならもう1回。金の輪の<b>強化玉</b>は1.5倍。</span></li>
      <li><span class="n">3</span><span>敵も黒い穴から玉を流してくる。<b>あと○</b>が0になると攻撃や盤への技。</span></li>
      <li><span class="n">4</span><span>キャラの顔をタップでスキル。5階のボスをたおせばクリア。</span></li>
    </ul>
    <button class="btn" id="howClose" type="button">わかった</button>
  </div>
</div>

<div class="glass" id="skill" hidden>
  <p id="skName"></p>
  <p id="skSkill"></p>
  <p id="skText"></p>
  <p id="skCharge"></p>
  <div class="row">
    <button class="btn" id="skUse" type="button">使う</button>
    <button class="link" id="skClose" type="button">とじる</button>
  </div>
</div>

<div class="panel dim" id="result" hidden>
  <div class="card glass">
    <p class="big" id="rBig"></p>
    <p class="sub" id="rSub"></p>
    <button class="btn" id="againBtn" type="button">もう一度</button>
  </div>
</div>

<div id="rotate" hidden>スマホを縦にしてね</div>

<script src="js/data.js"></script>
<script src="js/rules.js"></script>
<script src="js/battle.js"></script>
<script src="js/audio.js"></script>
<script src="js/music.js"></script>
<script src="js/view.js"></script>
<script type="importmap">

  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="js/beads3d.js"></script>
